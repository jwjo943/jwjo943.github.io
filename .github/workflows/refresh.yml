name: Refresh disclosure data and deploy

# 한화생명 상품공시실을 재수집해 사이트를 다시 만들고 Pages 로 배포한다.
# 공시는 수시로 바뀌므로(상품 추가/판매중지/약관 개정) 기준일이 고정된 사이트는
# 보는 쪽을 틀린 결론으로 유도한다. 그래서 주 1회 자동 갱신한다.
#
# 배포 방식은 Actions 아티팩트다. 레포에는 소스만 두고 생성물(_site)은 커밋하지
# 않으므로, 빌드 스크립트가 공개 URL 로 서빙되지 않는다.

on:
  schedule:
    # 매주 월요일 03:00 KST (일요일 18:00 UTC)
    - cron: "0 18 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    # paths 화이트리스트가 아니라 paths-ignore 를 쓴다. Pages 의 legacy 빌드는
    # 필터와 무관하게 모든 푸시에 돌기 때문에, 이 워크플로가 걸러져 돌지 않으면
    # legacy 가 단독으로 레포 루트(사이트 파일 없음)를 배포해 전체 404 가 된다.
    # data/products.json 만 바뀐 푸시는 이 워크플로의 자체 커밋이므로 제외한다
    # (제외하지 않으면 무한 재실행).
    # 문서만 바뀐 푸시도 제외하면 안 된다 — legacy 가 단독 실행되어 사이트가 죽는다.
    paths-ignore:
      - "data/**"

permissions:
  contents: write   # 갱신된 data/products.json 커밋
  pages: write
  id-token: write

# 동시 배포 금지. 진행 중인 배포를 취소하지 않는다 (사이트가 반쯤 올라간 상태 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch disclosure data
        id: fetch
        # 공시실이 죽어 있으면 수집이 실패한다. 그 경우 커밋된 직전 데이터로
        # 빌드를 계속해 사이트를 내리지 않는다.
        run: |
          if python scripts/fetch_products.py; then
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::수집 실패. 커밋된 data/products.json 으로 빌드를 계속한다."
            echo "fetched=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/products.json
          fi

      - name: Show data diff
        run: python scripts/diff_products.py

      - name: Build site
        run: python scripts/build_site.py --clean --out _site

      - name: Sync built site into repo root
        # Pages 가 legacy 모드인 동안은 모든 푸시에 레포 루트가 빌드되어 배포된다.
        # 루트에 생성물이 없으면 legacy 가 빈 사이트를 올려 전체 404 가 된다
        # (2026-10-13 커밋 87c4193 에서 실제 발생). 루트에도 같은 산출물을 두어
        # legacy 와 Actions 어느 쪽이 이겨도 올바른 사이트가 나오게 한다.
        # --delete 로 사라진 상품의 낡은 페이지도 정리한다. 소스는 제외.
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '_site/' \
            --exclude 'scripts/' \
            --exclude 'static/' \
            --exclude 'build.bat' \
            --exclude 'site.config.json' \
            --exclude 'NEXT.md' \
            --exclude 'data/products.json' \
            --exclude 'data/jsonld/' \
            _site/ ./
          git status --short | head -20
          echo "변경 파일 수: $(git status --porcelain | wc -l)"

      - name: Commit refreshed data and site
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "커밋할 변경 없음"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            # [skip ci]: 이 커밋이 다시 이 워크플로를 트리거하면 무한 루프가 된다.
            # Actions 만 건너뛰고 Pages 의 legacy 빌드는 그대로 돌아 사이트를 올린다.
            git commit -m "Refresh disclosure data and rebuild site ($(date -u +%Y-%m-%d)) [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
        # enablement: Pages 가 꺼져 있으면 켜고, build_type 을 legacy -> workflow 로
        # 전환한다. 레포 소유자의 gh OAuth 토큰으로는 이 API 가 404 라, 워크플로의
        # GITHUB_TOKEN(pages: write)으로 처리한다.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Submit to IndexNow
        # 배포 성공 후에만. 키 파일이 라이브여야 제출이 통과한다.
        run: python scripts/submit_indexnow.py
